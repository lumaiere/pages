<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumAIere.com</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7VHSE7PX07"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-7VHSE7PX07');
    </script>
</head>
<body>
    <div id="art-display" class="fade">
    </div>

    <div id="gallery-view" class="fade">
    </div>

    <div id="prompt-magic-gallery" class="fade">
    </div>

    <div id="video-gallery" class="video-gallery hidden">
        <!-- Videos will be injected dynamically -->
    </div>
    
    <div id="fullscreen-popup" class="hidden">
        <span class="close-popup">×</span>
        <img id="popup-image" src="" alt="Fullscreen Image">
    </div>

    <!-- Links for switching galleries -->
    <div id="gallery-links"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('gallery-links');
            if (!container) return;

            // Try relative first (works on GitHub Pages and local servers), fall back to root
            fetch('footer-links.html')
                .catch(() => fetch('/footer-links.html'))
                .then(res => res ? res.text() : '')
                .then(html => {
                    if (html) {
                        container.innerHTML = html;
                    } else {
                        throw new Error('Empty footer response');
                    }
                })
                .catch(err => {
                    console.error('Failed to load gallery links', err);
                    container.innerHTML = '<a href="games/index.html">Games</a> <a href="demos/index.html">Demos</a>';
                });
        });
    </script>
    <script src="scripts.js"></script>
</body>
</html>
